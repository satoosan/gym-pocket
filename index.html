<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gym Pocket</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=10_3" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">GYM POCKET</p>
        <h1 id="pageTitle">Hoje</h1>
      </div>
      <button class="icon-btn" id="installBtn" hidden aria-label="Instalar app">＋</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Hoje</small></button>
      <button data-view="workouts" class="nav-item"><span>🏋</span><small>Treinos</small></button>
      <button data-view="exercises" class="nav-item"><span>☷</span><small>Exercícios</small></button>
      <button data-view="history" class="nav-item"><span>◫</span><small>Histórico</small></button>
      <button data-view="body" class="nav-item"><span>◉</span><small>Corpo</small></button>
      <button data-view="progress" class="nav-item"><span>↗</span><small>Progresso</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button value="cancel" class="icon-btn" type="button" id="modalClose">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </form>
  </dialog>

  <template id="emptyTemplate">
    <section class="empty-state">
      <div class="empty-icon">✦</div>
      <h3>Nada por aqui ainda</h3>
      <p>Adicione seu primeiro registro para começar.</p>
    </section>
  </template>

  <script src="app.js?v=10_3"></script>
</body>
</html>
